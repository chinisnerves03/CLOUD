<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>AI ลัดมือ</title>
<style>
@font-face{font-family:P;font-weight:500;src:url(../../video/prompt-thai-500-normal.woff2)}
@font-face{font-family:P;font-weight:700;src:url(../../video/prompt-thai-700-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(../../video/prompt-thai-800-normal.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#12132B;font-family:P,sans-serif;color:#FFF8EE}
#stage{position:relative;width:1080px;height:1920px;background:radial-gradient(900px 700px at 80% 10%,#2B2E6B55,transparent),radial-gradient(800px 800px at 10% 95%,#FF4D6D33,transparent),#12132B}
.s{position:absolute;inset:0;padding:150px 80px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0}
.brand{position:absolute;top:70px;left:80px;display:flex;align-items:center;gap:20px;font-weight:700;font-size:40px;z-index:5}
.brand img{width:76px;height:76px;border-radius:20px}
.bar{position:absolute;left:0;bottom:0;height:12px;background:linear-gradient(90deg,#FF8A3D,#FF4D6D);width:0}
.big{font-weight:800;font-size:120px;line-height:1.2}
.mid{font-weight:700;font-size:72px;line-height:1.35}
.hl{color:#FFD23F}.pk{color:#FF6B8B}.gn{color:#4ADE80}.bl{color:#7FA8FF}
.tile{width:900px;border-radius:44px;padding:44px 52px;margin:20px 0;font-weight:800;font-size:76px;text-align:left;display:flex;align-items:center;gap:34px;opacity:0;line-height:1.2}
.tile small{display:block;font-size:38px;font-weight:500;opacity:.9;margin-top:6px}
.n{width:116px;height:116px;border-radius:34px;background:#12132B33;display:flex;align-items:center;justify-content:center;font-size:68px;flex:none}
.card{width:920px;border-radius:48px;padding:52px;text-align:left;font-size:56px;line-height:1.55;font-weight:500;background:#1D1F45}
.tag{display:inline-block;font-weight:800;font-size:44px;padding:8px 32px;border-radius:999px;margin-bottom:28px}
.cta{font-weight:800;font-size:150px;background:linear-gradient(90deg,#FF8A3D,#FF4D6D);padding:20px 70px;border-radius:60px;color:#fff;display:inline-block}
.chip{display:inline-block;font-weight:700;font-size:58px;background:#7C5CFF;border-radius:999px;padding:16px 46px;margin:14px 0}
</style></head><body>
<div id="stage">
 <div class="brand"><img src="../../avatar.svg">AI ลัดมือ</div>

 <div class="s" data-a="0" data-b="6.4">
  <div class="big">ตอบลูกค้า<span class="pk">ช้า</span></div>
  <div class="mid" style="margin-top:50px" data-a="1.5">เสียยอดขายทุกวัน 💸</div>
  <div class="mid hl" style="margin-top:70px" data-a="3.5">ให้ AI ร่างคำตอบให้<br>ใน 3 ขั้นตอน</div>
 </div>
 <div class="s" data-a="6.4" data-b="20.9">
  <div class="tile" data-a="7" style="background:#FF8A3D"><div class="n">1</div><div>วางข้อความลูกค้า</div></div>
  <div class="tile" data-a="9.3" style="background:#FF4D6D"><div class="n">2</div><div>บอกนโยบายร้าน<small>เช่น คืนสินค้าได้ใน 7 วัน</small></div></div>
  <div class="tile" data-a="14" style="background:#7C5CFF"><div class="n">3</div><div>สั่งโทนคำตอบ<small>สุภาพ ไม่เกิน 3 บรรทัด ไม่สัญญาเกินจริง</small></div></div>
  <div class="mid hl" style="margin-top:40px" data-a="18.9">แล้วคุณแค่อ่าน…กดส่ง ✅</div>
 </div>
 <div class="s" data-a="20.9" data-b="99">
  <div class="mid">อยากได้คำสั่ง<br>ตอบลูกค้าพร้อมใช้</div>
  <div class="mid" style="margin:50px 0 30px" data-a="22.3">คอมเมนต์คำว่า</div>
  <div class="cta" data-a="22.7">prompt</div>
  <div class="mid hl" style="margin-top:60px" data-a="24.2">รับฟรี 🎁</div>
 </div>
 <div class="bar" id="bar"></div>
</div>
<script>
const DUR=25.55;
const seg=new Intl.Segmenter('th',{granularity:'grapheme'});
const ease=x=>1-Math.pow(1-x,3);
const all=[...document.querySelectorAll('[data-a]')];
function seek(t){
  all.forEach(e=>{
    const a=+e.dataset.a,b=e.dataset.b?+e.dataset.b:1e9;
    const isScreen=e.classList.contains('s');
    const p=Math.min(1,Math.max(0,(t-a)/0.35));
    let o=ease(p);
    if(t>b-0.2&&isScreen)o*=Math.max(0,(b-t)/0.2);
    e.style.opacity=o;
    e.style.transform=isScreen?'none':`translateY(${(1-ease(p))*40}px) scale(${0.94+0.06*ease(p)})`;
  });
  document.getElementById('bar').style.width=(t/DUR*100)+'%';
}
seek(0);
</script></body></html>
