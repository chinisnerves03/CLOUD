const $=id=>document.getElementById(id);
const EC='#9dff7a';
function setFace(id,o){ // o:{blink,open,mood,gx}
  const bl=o.blink,m=o.mood,gx=o.gx||0;let eyes='';
  const ey=128,xs=[112,188];

    if(m==='happy'||m==='proud'){eyes+=`<path d="M${x-22+gx} ${ey+12} Q${x+gx} ${ey-22} ${x+22+gx} ${ey+12}" stroke="${EC}" stroke-width="12" stroke-linecap="round" fill="none"/>`}

  });
  $(id+'_eyes').innerHTML=eyes;
  let br='';if(m==='worried')br='M86 86 L134 100 M214 86 L166 100';else if(m==='confused')br='M86 92 L134 90 M170 84 L214 98';else if(m==='angry')br='M86 90 L134 104 M214 90 L166 104';
  $(id+'_br').setAttribute('d',br);

  if(mo>0.1){const w=22+mo*10,h=6+mo*34;d=`M${150-w} 168 Q150 ${168+h*1.7} ${150+w} 168 Q150 ${168-6} ${150-w} 168Z`;$(id+'_m').setAttribute('fill','#7a2a4a')}
  else{$(id+'_m').setAttribute('fill','none');
    if(m==='worried')d='M120 182 Q135 166 150 180 Q165 194 180 180';else if(m==='confused')d='M122 178 Q150 168 178 182';else if(m==='happy'||m==='proud')d='M116 164 Q150 196 184 164';else d='M122 168 Q150 184 178 168'}

const SPK={B:[[0.4,0.98],[1.29,3.48],[14.4,17.17]],E:[[3.8,5.0],[5.34,6.8],[18.3,21.22],[21.61,24.65],[25.0,25.2]],A:[[7.2,10.35],[10.75,13.01],[13.32,13.97]]};

 ['B',0.4,0.98,'น้องฟ้า!'],['B',1.29,3.48,'ขอตัวเลขยอดขายไตรมาสที่แล้วหน่อย'],

 ['E',18.3,21.22,'ผมลืมสั่งว่า ใช้เฉพาะข้อมูลที่ให้'],['E',21.61,24.65,'และถ้าไม่แน่ใจ ให้บอกว่าไม่แน่ใจครับ'],

const TAG={B:['เจ้านาย','#ff9a4d'],E:['น้องฟ้า','#4fe0d2'],A:['AI (ในโน้ตบุ๊ก)','#9dff7a'],N:['ผู้บรรยาย','#ffd23f']};

function camAt(t){let i=0;while(i+1<CAM.length&&CAM[i+1][0]<=t)i++;const a=CAM[i],b=CAM[Math.min(i+1,CAM.length-1)];const k=b[0]>a[0]?E((t-a[0])/Math.min(0.6,b[0]-a[0])):1;return[a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,a[3]+(b[3]-a[3])*k]}
const CUTS=[0.1,3.8,7.2,13.3,14.4,17.2,18.3,25.0,28.3];

const nc=$('noise'),ng=nc.getContext('2d');
function draw(t){
  // glitch strength

  // bots
  const bossIn=E((t-0.1)/0.5);$('boss').style.transform=`translateX(${(1-bossIn)*420}px) translateY(${Math.sin(t*2.3)*4}px)`;

  // laptop AI face

  $('aieyes').innerHTML=`<svg width="372" height="96" viewBox="0 0 372 96"><ellipse cx="116" cy="46" rx="26" ry="${Math.max(5,(aOn?30:18)*(1-ae))}" fill="${EC}"/><ellipse cx="256" cy="46" rx="26" ry="${Math.max(5,(aOn?30:18)*(1-ae))}" fill="${EC}"/>${speaking('A',t)?`<ellipse cx="186" cy="82" rx="${16+8*Math.abs(Math.sin(t*14))}" ry="${4+7*Math.abs(Math.sin(t*14+1))}" fill="${EC}"/>`:`<path d="M160 80 Q186 90 212 80" stroke="${EC}" stroke-width="7" fill="none" stroke-linecap="round"/>`}</svg>`;
  const errT=t-13.32;$('err').style.opacity=(errT>=0&&errT<0.7)?(Math.floor(errT*10)%2===0?0.55:0.12):0;
  // ? and sweat
  const q=$('q1');const qo=(t>=14.5&&t<18.1)?E((t-14.5)/0.2):0;q.style.opacity=qo;q.style.transform=`scale(${0.6+0.4*qo}) rotate(${Math.sin(t*6)*6}deg)`;
  [['sw1',205,640,0],['sw2',150,670,0.5],['sw3',330,650,0.9]].forEach(([id,x,y,ph])=>{const el=$(id);const on=(t>=14.4&&t<25.0)?1:0;const u=((t*1.3+ph)%1);el.style.opacity=on*(1-u);el.style.left=(x+Math.sin(ph*6)*8)+'px';el.style.top=(y+u*90)+'px'});
  // subtitles
  let h='';for(const s of SUBS){if(t>=s[1]&&t<s[2]){const tg=TAG[s[0]];h=`<span class="t" style="color:${tg[1]}">${tg[0]}</span><span class="l">${s[3]}</span>`;break}}
  if(subEl._h!==h){subEl.innerHTML=h;subEl._h=h}
  // OSD
  const sec=Math.floor(t);$('osdR').textContent='0:'+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  $('osdL').textContent=(t>=24.6&&t<25.0)?'◀◀ REW':(Math.floor(t*1.6)%2===0?'PLAY ▶ SP':'PLAY    SP');
  $('rew').style.opacity=0;
  // tape noise
  ng.clearRect(0,0,270,480);
  const f=Math.floor(t*30);
  for(let i=0;i<260;i++){const x=rnd(f*7+i)*270,y=rnd(f*13+i*3)*480;const a=rnd(i+f)*0.2+0.05;ng.fillStyle=`rgba(255,255,255,${a})`;ng.fillRect(x,y,2+rnd(i*5+f)*6,1)}
  const by=((t*110)%520)-30;ng.fillStyle='rgba(255,255,255,0.10)';ng.fillRect(0,by,270,3);
  for(let x=0;x<270;x+=3){ng.fillStyle=`rgba(255,255,255,${rnd(f*3+x)*0.35})`;ng.fillRect(x,by+3,3,5)}
  if(gl>0){for(let k=0;k<3;k++){const y=rnd(f+k*17)*470;const hh=6+rnd(f+k)*14;for(let x=0;x<270;x+=2){ng.fillStyle=`rgba(255,255,255,${rnd(f+x+k)*gl*0.7})`;ng.fillRect(x,y,2,hh)}}}
  if(t>=24.6&&t<25.0){for(let y=0;y<480;y+=4){ng.fillStyle=`rgba(255,255,255,${rnd(f+y)*0.5})`;ng.fillRect(0,y,270,2)}}
}
const _s=seek;seek=function(t){_s(t);draw(t)};
seek(0);
</script></body></html>
