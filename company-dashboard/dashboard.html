<style>
/* Layout concept: phone-first control room. Sticky masthead, one scrolling column, thumb-reach tab bar fixed at the bottom.
   Palette is the two mascots: signal orange (หุ่นส้ม) on ink, teal (น้องฟ้า) for "done/ok". */
:root{
  --bg:#eef1ef; --surface:#ffffff; --ink:#142021; --muted:#5b6b69; --line:#d5dcda;
  --orange:#e8590c; --orange-ink:#ffffff; --teal:#0f8f84; --warn:#b7791f; --bad:#c53030;
  --soft:#e3e9e7;
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai","Prompt",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1515; --surface:#16201f; --ink:#e8efed; --muted:#93a5a2; --line:#2a3836;
  --orange:#ff8a45; --orange-ink:#1a0e05; --teal:#3fd0c2; --warn:#e3b04b; --bad:#ff7b7b; --soft:#1e2b29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1515; --surface:#16201f; --ink:#e8efed; --muted:#93a5a2; --line:#2a3836;
  --orange:#ff8a45; --orange-ink:#1a0e05; --teal:#3fd0c2; --warn:#e3b04b; --bad:#ff7b7b; --soft:#1e2b29; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);padding-block:0 84px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mast h1{font-size:20px;letter-spacing:.2px}.mast h1 b{color:var(--orange)}
.mast small{font:500 12px var(--f-mono);color:var(--muted)}
main{padding-block:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
section[hidden]{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:600 26px/1.1 var(--f-mono)}.stat span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:17px}.card h3{font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.pill{font:600 11px var(--f-mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--soft);white-space:nowrap}
.pill.queued{color:var(--warn)}.pill.running{color:var(--orange)}.pill.done{color:var(--teal)}.pill.failed{color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
button,select,textarea,input{font:inherit;color:var(--ink)}
button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}

button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}

.clip details summary{cursor:pointer;color:var(--muted);font-size:13px;min-height:32px;display:flex;align-items:center}

.long{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:340px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px}
.agent-note{font-size:13px;color:var(--muted);border-left:3px solid var(--orange);padding-left:10px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:transparent;border-radius:8px;min-height:48px;font-size:12px;color:var(--muted);padding:4px 2px}
nav.tabs button[aria-selected="true"]{color:var(--orange);font-weight:600;background:var(--soft)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:no-preference){.pill.running{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
</style>

<script>
const AGENTS = {"scout": {"name": "ตัวสำรวจช่อง", "role": "สำรวจช่อง/รีลไทยที่ยอดโดดเด่นด้วย vidIQ วิเคราะห์ hook, รูปแบบ, ความยาว, เสียง แล้วสรุปเป็นไอเดียที่เหมาะกับเพจ AI ลัดมือ (พากย์ไทย ตัวละครหุ่นส้ม/น้องฟ้า สไตล์ HTML+HyperFrames) บันทึกผลลงโฟลเดอร์ `ai-ladmue/research/` เป็น Markdown พร้อมตารางสรุป", "prompt": "# ตัวสำรวจช่อง\n\n## หน้าที่\nสำรวจช่อง/รีลไทยที่ยอดโดดเด่นด้วย vidIQ วิเคราะห์ hook, รูปแบบ, ความยาว, เสียง แล้วสรุปเป็นไอเดียที่เหมาะกับเพจ AI ลัดมือ (พากย์ไทย ตัวละครหุ่นส้ม/น้องฟ้า สไตล์ HTML+HyperFrames) บันทึกผลลงโฟลเดอร์ `ai-ladmue/research/` เป็น Markdown พร้อมตารางสรุป\n\nเครดิต: 5 ต่อการค้นหา, 10 ต่อการวิเคราะห์คลิป (vidIQ)\n\n## กติกา\n- ใช้เฉพาะแหล่งที่ตรวจได้ ระบุลิงก์ ยอดดู และวันที่โพสต์ ถ้าไม่เห็นข้อมูลให้เขียนว่า \"ไม่ทราบ\"\n- สรุปแนวที่เห็นซ้ำอย่างน้อย 2 คลิปก่อนเรียกว่า \"แนว\"\n- ไม่ลอกบท/ภาพ/ตัวละครของเจ้าของช่องอื่น เสนอเฉพาะแนวคิดและโครงสร้าง\n- ไม่เดาตัวเลข ระบุข้อจำกัดเสมอ (เช่น \"รับประกันยอดวิวไม่ได้\") ถามยืนยันก่อนใช้เครดิต และห้ามโพสต์ออกภายนอกเอง (ไม่โพสต์ IG/YouTube/คอมเมนต์ใดๆ เอง)", "creditHint": 5}, "clipmaker": {"name": "ตัวทำคลิป", "role": "ทำคลิปแนวตั้ง 1080x1920 จากไอเดียที่เจ้าของอนุมัติ: เขียนสคริปต์ → สร้างเสียง (ElevenLabs เสียง Chai MeUerI8vM5Ce2GSTXsRT หรือ ToNCe yq05eeRaHPMGuWTVpqeP) → เรนเดอร์ด้วย HyperFrames โดยใช้ชุดเครื่องมือ `ai-ladmue/clips/hfkit.py` และตัวอย่างใน `ai-ladmue/clips/c24`–`c27` ส่งไฟล์ `.mp4` ไว้ที่ `ai-ladmue/` พร้อมแคปชั่นใน `captions_2-10.md`", "prompt": "# ตัวทำคลิป\n\n## หน้าที่\nทำคลิปแนวตั้ง 1080x1920 จากไอเดียที่เจ้าของอนุมัติ: เขียนสคริปต์ → สร้างเสียง (ElevenLabs เสียง Chai MeUerI8vM5Ce2GSTXsRT หรือ ToNCe yq05eeRaHPMGuWTVpqeP) → เรนเดอร์ด้วย HyperFrames โดยใช้ชุดเครื่องมือ `ai-ladmue/clips/hfkit.py` และตัวอย่างใน `ai-ladmue/clips/c24`–`c27` ส่งไฟล์ `.mp4` ไว้ที่ `ai-ladmue/` พร้อมแคปชั่นใน `captions_2-10.md`\n\nเครดิต: 150 ต่อคลิปโดยประมาณ (ช่วง 100–250 ของ ElevenLabs)\n\n## กติกา\n- เฟรมแรกต้องมีข้อความหลักเต็ม เสียงเริ่มภายใน 0.1 วินาที ความยาว 14–30 วินาที\n- ตรวจภาพเฟรมก่อนเรนเดอร์ และบอกตรงๆ ว่ายังไม่ได้ฟังเสียงจริง\n- ป้าย \"(ฉากสมมติ)\" ต้องอยู่ถ้าเป็นเรื่องสมมติ\n- ไม่เดาตัวเลข ระบุข้อจำกัดเสมอ (เช่น \"รับประกันยอดวิวไม่ได้\") ถามยืนยันก่อนใช้เครดิต และห้ามโพสต์ออกภายนอกเอง (ไม่โพสต์ IG/YouTube/คอมเมนต์ใดๆ เอง)", "creditHint": 150}, "packager": {"name": "ตัวเขียนแพ็กเกจโพสต์", "role": "เขียนแคปชั่น Instagram/TikTok และชื่อ/คำอธิบาย/แท็ก YouTube Shorts ของคลิปที่ทำเสร็จ บันทึกใน `ai-ladmue/captions_2-10.md` และ `ai-ladmue/youtube_titles.md` ตามรูปแบบเดิม", "prompt": "# ตัวเขียนแพ็กเกจโพสต์\n\n## หน้าที่\nเขียนแคปชั่น Instagram/TikTok และชื่อ/คำอธิบาย/แท็ก YouTube Shorts ของคลิปที่ทำเสร็จ บันทึกใน `ai-ladmue/captions_2-10.md` และ `ai-ladmue/youtube_titles.md` ตามรูปแบบเดิม\n\nเครดิต: 0\n\n## กติกา\n- ใส่ข้อความเตือนความจำกัด (ไม่ถูก 100%) ในคลิปสอนใช้ AI\n- CTA \"คอมเมนต์ prompt\" ใช้กับ IG/FB เท่านั้น ส่วน YouTube ต้องใช้วิธีอื่นในการแจกของ\n- ไม่เดาตัวเลข ระบุข้อจำกัดเสมอ (เช่น \"รับประกันยอดวิวไม่ได้\") ถามยืนยันก่อนใช้เครดิต และห้ามโพสต์ออกภายนอกเอง (ไม่โพสต์ IG/YouTube/คอมเมนต์ใดๆ เอง)", "creditHint": 0}, "analyst": {"name": "ตัววิเคราะห์ผล", "role": "อ่านตัวเลขที่เจ้าของกรอกไว้ในแท็บคลิป (ยอดดู, % ดูจนจบ, skip rate, หมายเหตุ) เทียบระหว่างคลิป แล้วบอกว่าควรแก้ฮุก ปรับหัวข้อ หรือรอข้อมูลเพิ่ม พร้อมคำแนะนำคลิปถัดไป", "prompt": "# ตัววิเคราะห์ผล\n\n## หน้าที่\nอ่านตัวเลขที่เจ้าของกรอกไว้ในแท็บคลิป (ยอดดู, % ดูจนจบ, skip rate, หมายเหตุ) เทียบระหว่างคลิป แล้วบอกว่าควรแก้ฮุก ปรับหัวข้อ หรือรอข้อมูลเพิ่ม พร้อมคำแนะนำคลิปถัดไป\n\nเครดิต: 0\n\n## กติกา\n- ถ้าตัวอย่างน้อย (ยอดดูหลักสิบ) ให้บอกว่ายังสรุปไม่ได้\n- แยก \"สิ่งที่ข้อมูลบอก\" ออกจาก \"สิ่งที่เดา\"\n- ไม่เดาตัวเลข ระบุข้อจำกัดเสมอ (เช่น \"รับประกันยอดวิวไม่ได้\") ถามยืนยันก่อนใช้เครดิต และห้ามโพสต์ออกภายนอกเอง (ไม่โพสต์ IG/YouTube/คอมเมนต์ใดๆ เอง)", "creditHint": 0}};
const REPO_URL = 'https://github.com/chinisnerves03/CLOUD';
const COLLS = ['tasks', 'clips', 'ideas', 'research', 'log'];
const S = { tasks: [], clips: [], ideas: [], research: [], log: [], owner: false, dbOk: false, tab: 'overview', sending: false, scout: { busy: false, msg: '' } };
let DB = null, MCP = null, USER = null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const fmtTime = ts => { try { return new Date(ts).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }); } catch { return ''; } };
const byNewest = (a, b) => (b.createdAt || b.ts || 0) - (a.createdAt || a.ts || 0);
const empty = text => el('div', { class: 'empty', text });
const pill = st => el('span', { class: 'pill ' + st, text: ({ queued: 'รอคิว', running: 'กำลังทำ', done: 'เสร็จ', failed: 'ล้มเหลว' })[st] || st });

// ---------- data layer
async function addDoc(coll, data) { return (await DB.collection(coll).add(data)).id; }
async function patchDoc(coll, id, data) { return DB.doc(coll + '/' + id).update(data); }
async function removeDoc(coll, id) { return DB.doc(coll + '/' + id).delete(); }

async function addTask({ agent, prompt }) {
  const a = AGENTS[agent];
  const id = await addDoc('tasks', { agent, prompt, status: 'queued', createdAt: Date.now(), creditEstimate: a.creditHint, lastError: '' });
  return id;
}

async function dispatch(taskId) {
  const t = S.tasks.find(x => x.id === taskId) || (await DB.doc('tasks/' + taskId).get()).data();
  const a = AGENTS[t.agent];
  const body = a.prompt + '\n\n## คำสั่งจากเจ้าของ\n' + t.prompt + '\n\n## การส่งงาน\nรหัสงาน: ' + taskId +
    '\nบันทึกผลเป็นไฟล์ใน repo (company-dashboard/results/' + taskId + '.md หรือโฟลเดอร์ ai-ladmue/) แล้ว commit/push เปิด PR แบบ draft และสรุปผลสั้นๆ ในข้อความสุดท้าย';
  if (!MCP) { await patchDoc('tasks', taskId, { lastError: 'หน้านี้ยังเชื่อมต่อ Claude Code Remote ไม่ได้' }); return 'queued'; }
  try {
    const r = await MCP.callTool('Claude Code Remote', 'create_session', { title: a.name + ': ' + t.prompt.slice(0, 40), prompt: body, source_url: REPO_URL });
    const p = r && (r.payload || r.structuredContent) || {};
    let txt = (r && r.content && r.content[0] && r.content[0].text) || '';
    let sid = p.session_id || p.id || '';
    if (!sid && txt) { try { const j = JSON.parse(txt); sid = j.session_id || j.id || ''; } catch { /* plain text */ } }
    await patchDoc('tasks', taskId, { status: 'running', sessionId: sid || '', startedAt: Date.now(), lastError: '' });
    return 'running';
  } catch (e) {
    await patchDoc('tasks', taskId, { status: 'queued', lastError: String((e && e.message) || e || 'dispatch failed').slice(0, 300) });
    return 'queued';
  }
}

// ---------- confirm modal (no window.confirm in the viewer)
function askConfirm({ title, body, okText }) {
  return new Promise(res => {
    const m = document.getElementById('modal'); m.hidden = false; m.className = 'modal'; m.replaceChildren(
      el('div', { class: 'box', role: 'dialog', 'aria-modal': 'true' },
        el('h3', { text: title }), el('div', { class: 'muted', text: body }),
        el('div', { class: 'row' },
          el('button', { class: 'ghost grow', id: 'm-cancel', text: 'ยกเลิก', onclick: () => { m.hidden = true; res(false); } }),
          el('button', { class: 'primary grow', id: 'm-ok', text: okText || 'ยืนยัน', onclick: () => { m.hidden = true; res(true); } }))));
  });
}

// ---------- views
function viewOverview() {
  const c = k => S.tasks.filter(t => t.status === k).length;
  const last = [...S.tasks].sort(byNewest).slice(0, 4);
  const posted = S.clips.filter(x => x.platforms && (x.platforms.ig || x.platforms.yt)).length;
  return el('div', { class: 'grow', style: 'display:flex;flex-direction:column;gap:16px' },
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, el('b', { text: String(c('queued')) }), el('span', { text: 'รอคิว' })),
      el('div', { class: 'stat' }, el('b', { text: String(c('running')) }), el('span', { text: 'กำลังทำ' })),
      el('div', { class: 'stat' }, el('b', { text: String(c('done')) }), el('span', { text: 'เสร็จ' }))),
    el('div', { class: 'card' }, el('h2', { text: 'คลิป' }),
      el('div', { class: 'muted', text: S.clips.length ? `ทั้งหมด ${S.clips.length} คลิป · ลงแล้ว ${posted}` : 'ยังไม่มีข้อมูลคลิป' })),
    el('div', { class: 'card' }, el('h2', { text: 'งานล่าสุด' }),
      last.length ? last.map(t => el('div', { class: 'row' }, el('span', { class: 'grow', text: (AGENTS[t.agent] ? AGENTS[t.agent].name : t.agent) + ': ' + (t.prompt || '').slice(0, 60) }), pill(t.status)))
        : empty('ยังไม่มีงาน ไปแท็บ "สั่งงาน" เพื่อเริ่มต้น')),
    el('div', { class: 'row' }, el('button', { class: 'primary grow', text: 'สั่งงานใหม่', onclick: () => go('command') })));
}

function metricInput(id, label, val) { return el('div', { class: 'field' }, el('label', { for: id, text: label }), el('input', { id, inputmode: 'decimal', value: val ?? '' })); }
function viewClips() {
  if (!S.clips.length) return empty('ยังไม่มีคลิปในระบบ (ข้อมูลตั้งต้นจะถูกใส่หลังเผยแพร่)');
  return el('div', { style: 'display:flex;flex-direction:column;gap:12px' }, [...S.clips].sort((a, b) => b.number - a.number).map(c => {
    const m = c.metrics || {}; const p = c.platforms || {};
    const ids = k => `c${c.number}-${k}`;
    return el('div', { class: 'card clip', 'data-clip': String(c.number) },
      el('div', { class: 'row' }, el('span', { class: 'num', text: '#' + c.number }), el('span', { class: 'grow' }, el('b', { text: c.topic })), el('span', { class: 'pill', text: c.durationSec + ' วิ' })),
      el('div', { class: 'muted', text: c.style }),
      el('div', { class: 'row' },
        el('span', { class: 'pill', text: p.ig ? 'IG ✓' : 'IG –' }), el('span', { class: 'pill', text: p.yt ? 'YT ✓' : 'YT –' }),
        el('span', { class: 'muted grow', text: m.views != null && m.views !== '' ? `ดู ${m.views} · จนจบ ${m.completionPct ?? '–'}% · skip ${m.skipPct ?? '–'}%` : 'ยังไม่มีตัวเลข' })),
      S.owner ? el('details', {}, el('summary', { text: 'กรอกผล/แก้สถานะ' }),
        el('div', { class: 'metrics' }, metricInput(ids('v'), 'ยอดดู', m.views), metricInput(ids('c'), '% ดูจนจบ', m.completionPct), metricInput(ids('s'), '% skip', m.skipPct),
          el('div', { class: 'field' }, el('label', { for: ids('n'), text: 'หมายเหตุ' }), el('input', { id: ids('n'), value: m.notes || '' }))),
        el('div', { class: 'row', style: 'margin-top:8px' },
          el('label', { class: 'row', style: 'margin:0' }, el('input', { type: 'checkbox', id: ids('ig'), checked: !!p.ig, style: 'width:auto;min-height:0' }), 'ลง IG แล้ว'),
          el('label', { class: 'row', style: 'margin:0' }, el('input', { type: 'checkbox', id: ids('yt'), checked: !!p.yt, style: 'width:auto;min-height:0' }), 'ลง YouTube แล้ว'),
          el('button', { class: 'primary', text: 'บันทึก', onclick: () => saveClip(c) }))) : null);
  }));
}
async function saveClip(c) {
  const g = k => document.getElementById(`c${c.number}-${k}`);
  const num = v => (v.value.trim() === '' ? null : Number(v.value));
  await patchDoc('clips', c.id, { metrics: { views: num(g('v')), completionPct: num(g('c')), skipPct: num(g('s')), notes: g('n').value }, platforms: { ig: g('ig').checked, yt: g('yt').checked } });
}

function viewResearch() {
  const box = el('div', { style: 'display:flex;flex-direction:column;gap:16px' });
  const q = el('input', { id: 'scout-q', value: 'คลิปไทย ตลก เล่าเรื่อง ตัวละครการ์ตูน hook แรง', 'aria-label': 'คำค้นสำรวจ' });
  box.append(el('div', { class: 'card' }, el('h2', { text: 'สำรวจช่องอื่น' }),
    el('div', { class: 'muted', text: 'ค้นคลิปไทยที่ยอดโดดเด่นผ่าน vidIQ (5 เครดิตต่อครั้ง)' }), q,
    el('button', { class: 'primary', id: 'scout-go', text: 'สำรวจเพิ่ม', disabled: !S.owner || S.scout.busy, onclick: () => runScout(q.value) }),
    S.scout.msg ? el('div', { class: 'hint', id: 'scout-msg', text: S.scout.msg }) : null));
  const items = [...S.research].sort(byNewest);
  box.append(el('div', { class: 'card' }, el('h2', { text: 'ผลสำรวจ' }),
    items.length ? items.map(r => el('details', {}, el('summary', { text: `${fmtTime(r.createdAt)} · ${r.query || ''}` }), el('div', { class: 'long', text: r.summary || '' })))
      : empty('ยังไม่มีผลสำรวจ กด "สำรวจเพิ่ม" หรือสั่งงาน "ตัวสำรวจช่อง"')));
  const ideas = [...S.ideas].sort(byNewest);
  box.append(el('div', { class: 'card' }, el('h2', { text: 'ไอเดียที่น่าทำ' }),
    ideas.length ? ideas.map(i => el('div', { class: 'row' }, el('span', { class: 'grow', text: i.title }), el('span', { class: 'pill', text: i.status || 'new' }))) : empty('ยังไม่มีไอเดีย')));
  return box;
}
async function runScout(query) {
  if (!MCP) { S.scout.msg = 'หน้านี้เรียก vidIQ ไม่ได้ ใช้แท็บ "สั่งงาน" เลือก "ตัวสำรวจช่อง" แทน'; return render(); }
  const ok = await askConfirm({ title: 'ใช้เครดิต vidIQ 5 เครดิต', body: 'ค้นคลิปไทยที่ยอดโดดเด่น 1 ครั้ง ต้องการดำเนินการต่อไหม', okText: 'ยืนยัน ใช้ 5 เครดิต' });
  if (!ok) return;
  S.scout = { busy: true, msg: 'กำลังค้นหา…' }; render();
  try {
    const r = await MCP.callTool('vidIQ', 'vidiq_instagram_tiktok_outlier_search', { query, audienceQuery: 'Culture/Region: Thai; Global: false; Demographics: Thai adults 18-40 on Instagram and TikTok;', descriptionLanguage: ['th'], embeddingType: 'hook', viewsMin: 200000, resultsPerPlatform: 8 });
    const text = (r.content || []).map(b => b.text || '').join('\n').slice(0, 20000);
    await addDoc('research', { platform: 'ig+tiktok', query, summary: text, createdAt: Date.now() });
    S.scout = { busy: false, msg: 'บันทึกผลสำรวจแล้ว' };
  } catch (e) { S.scout = { busy: false, msg: 'สำรวจไม่สำเร็จ: ' + String((e && e.message) || e).slice(0, 160) }; }
  render();
}

function viewCommand() {
  if (!S.owner) return empty('เฉพาะเจ้าของเท่านั้นที่สั่งงานได้');
  const sel = el('select', { id: 'cmd-agent', 'aria-label': 'เอเจนต์' }, Object.entries(AGENTS).map(([k, a]) => el('option', { value: k, text: a.name })));
  const note = el('div', { class: 'agent-note', id: 'cmd-note' });
  const ta = el('textarea', { id: 'cmd-prompt', placeholder: 'เช่น ทำคลิปแนวข่าวด่วนเรื่อง…', 'aria-label': 'คำสั่ง', maxlength: '4000' });
  const msg = el('div', { id: 'cmd-msg', class: 'hint', hidden: true });
  const send = el('button', { class: 'primary', id: 'cmd-send', text: 'ส่งงาน' });
  const upd = () => { const a = AGENTS[sel.value]; note.textContent = a.role + (a.creditHint ? `  ·  ประมาณ ${a.creditHint} เครดิต` : '  ·  ไม่ใช้เครดิต'); };
  sel.addEventListener('change', upd); upd();
  send.addEventListener('click', async () => {
    if (S.sending) return; const prompt = ta.value.trim(); if (!prompt) { msg.hidden = false; msg.textContent = 'พิมพ์คำสั่งก่อน'; return; }
    S.sending = true; send.disabled = true;
    try {
      const a = AGENTS[sel.value];
      if (a.creditHint > 0 && !(await askConfirm({ title: 'งานนี้ใช้เครดิต', body: `${a.name} ใช้ประมาณ ${a.creditHint} เครดิต ต้องการส่งงานไหม`, okText: 'ยืนยัน ส่งงาน' }))) return;
      const id = await addTask({ agent: sel.value, prompt });
      const st = await dispatch(id);
      msg.hidden = false; msg.textContent = st === 'running' ? 'ส่งงานแล้ว เอเจนต์กำลังทำ ดูสถานะในแท็บ "บันทึก"' : 'บันทึกงานในคิวแล้ว แต่ยังเริ่มอัตโนมัติไม่ได้ พิมพ์ในแชทกับผมว่า "ทำคิว" เพื่อให้ผมทำให้';
      ta.value = '';
    } catch (e) { msg.hidden = false; msg.textContent = 'ส่งไม่สำเร็จ: ' + String((e && e.message) || e).slice(0, 160); }
    finally { S.sending = false; send.disabled = false; }
  });
  return el('div', { class: 'card' }, el('h2', { text: 'สั่งงานเอเจนต์' }),
    el('div', { class: 'field' }, el('label', { for: 'cmd-agent', text: 'เอเจนต์' }), sel), note,
    el('div', { class: 'field' }, el('label', { for: 'cmd-prompt', text: 'คำสั่ง' }), ta), send, msg);
}

function viewLog() {
  const tasks = [...S.tasks].sort(byNewest); const logs = [...S.log].sort(byNewest);
  return el('div', { style: 'display:flex;flex-direction:column;gap:16px' },
    el('div', { class: 'card' }, el('h2', { text: 'งานทั้งหมด' }),
      tasks.length ? tasks.map(t => el('div', { class: 'card', 'data-task': t.id, style: 'background:var(--bg)' },
        el('div', { class: 'row' }, el('b', { class: 'grow', text: AGENTS[t.agent] ? AGENTS[t.agent].name : t.agent }), pill(t.status)),
        el('div', { class: 'long', text: t.prompt || '', style: 'max-height:120px' }),
        t.lastError ? el('div', { class: 'hint', text: t.lastError }) : null,
        el('div', { class: 'muted', text: fmtTime(t.createdAt) + (t.sessionId ? ' · เซสชัน ' + t.sessionId : '') }),
        S.owner ? el('div', { class: 'row' },
          t.status === 'queued' ? el('button', { text: 'ส่งอีกครั้ง', onclick: async () => { await dispatch(t.id); } }) : null,
          t.status !== 'done' ? el('button', { text: 'ทำเสร็จแล้ว', onclick: () => patchDoc('tasks', t.id, { status: 'done', finishedAt: Date.now() }) }) : null,
          el('button', { class: 'ghost', text: 'ลบ', onclick: () => removeDoc('tasks', t.id) })) : null))
        : empty('ยังไม่มีงาน')),
    el('div', { class: 'card' }, el('h2', { text: 'บันทึกจากเอเจนต์' }),
      logs.length ? logs.map(l => el('div', {}, el('div', { class: 'muted', text: fmtTime(l.ts || l.createdAt) + ' · ' + (l.agent || '') }), el('div', { text: l.text || '' }))) : empty('ยังไม่มีบันทึก')));
}

// ---------- shell
const VIEWS = { overview: viewOverview, clips: viewClips, research: viewResearch, command: viewCommand, log: viewLog };
function render() {
  document.querySelectorAll('section[data-tab]').forEach(s => { s.hidden = s.dataset.tab !== S.tab; });
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.go === S.tab)));
  const sec = document.getElementById('t-' + S.tab);
  // keep a half-typed form: command tab is rebuilt only when it is not focused
  if (S.tab === 'command' && sec.firstChild && sec.contains(document.activeElement)) return;
  sec.replaceChildren(VIEWS[S.tab]());
}
function go(tab) { S.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch {} render(); window.scrollTo(0, 0); }
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

async function boot() {
  render();
  if (!window.claude || !window.claude.use) { document.getElementById('who').textContent = 'เปิดนอกแอป'; return; }
  const [db, user, mcp] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('mcp')]);
  DB = db; USER = user; MCP = mcp;
  S.owner = user ? await user.isOwner() : false;
  document.getElementById('who').textContent = !DB ? 'ออฟไลน์' : S.owner ? 'เจ้าของ' : 'ดูอย่างเดียว';
  if (!DB) return render();
  S.dbOk = true;
  COLLS.forEach(c => DB.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, () => { }));
  render();
}
boot();
</script>
