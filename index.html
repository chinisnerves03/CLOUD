<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทำโพสต์ขายขนม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE4; --panel:#FFFDF8; --ink:#231F1A; --muted:#6E655A; --line:#DCD2C1;
  --jade:#1F5E4B; --persimmon:#D9572B; --field:#FFFFFF; --soft:#EAE2D3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1815; --panel:#24211D; --ink:#F1EBE0; --muted:#A99F92; --line:#3A352E;
    --jade:#5FB396; --persimmon:#F07A4F; --field:#1E1C19; --soft:#2E2A25;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1815; --panel:#24211D; --ink:#F1EBE0; --muted:#A99F92; --line:#3A352E;
  --jade:#5FB396; --persimmon:#F07A4F; --field:#1E1C19; --soft:#2E2A25;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-family:"Mitr",sans-serif;font-weight:600;font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-family:"IBM Plex Sans Thai",sans-serif;font-weight:400;font-size:16px;color:var(--muted);margin-top:8px;letter-spacing:0}
.grid{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2{font-family:"Mitr",sans-serif;font-weight:500;font-size:19px;margin:0 0 14px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:70px}
input:focus-visible,textarea:focus-visible,button:focus-visible,.drop:focus-visible{outline:3px solid var(--persimmon);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--soft);transition:border-color .15s}
.drop.over{border-color:var(--persimmon)}
.drop img{max-width:100%;max-height:170px;border-radius:10px;display:block;margin:0 auto 8px}
.drop p{margin:0;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--jade);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{border:2px solid var(--line);border-radius:12px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:8px;background:var(--field);cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.sw i{display:inline-flex;width:34px;height:22px;border-radius:6px;overflow:hidden}
.sw i b{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:none;font:inherit;font-size:14px;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1040px){.posts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.posts{grid-template-columns:1fr}}
.post{display:flex;flex-direction:column;gap:8px}
.post canvas{width:100%;height:auto;border-radius:12px;display:block;background:var(--soft)}
.post .meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.btn{font:inherit;font-size:15px;font-weight:500;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--panel)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);padding:6px 12px;font-size:14px}
.btn.accent{background:var(--persimmon);border-color:var(--persimmon);color:#fff;width:100%;margin-top:18px;font-family:"Mitr",sans-serif;font-size:17px;padding:12px}
.btn:disabled{opacity:.55;cursor:wait}
.caps{margin-top:24px}
.caps-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.caps-head h2{margin:0}
.caplist{display:grid;gap:12px}
.cap{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--field)}
.cap h3{font-family:"Mitr",sans-serif;font-weight:500;font-size:16px;margin:0 0 6px;color:var(--jade)}
.cap p{margin:0 0 8px;white-space:pre-wrap}
.cap .tags{color:var(--muted);font-size:14px;margin-bottom:10px}
.status{font-size:14px;color:var(--muted);min-height:1.4em}
.empty{color:var(--muted);font-size:15px;padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ทำโพสต์ขายขนม<small>ใส่รูปกับข้อมูลสินค้า ได้รูปโพสต์ 3 แบบพร้อมแคปชัน</small></h1>
    <div class="seg" role="group" aria-label="ขนาดรูป">
      <button type="button" data-format="square" aria-pressed="true">โพสต์ 1:1</button>
      <button type="button" data-format="story" aria-pressed="false">สตอรี่ 9:16</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-label="ข้อมูลสินค้า">
      <h2>ข้อมูลสินค้า</h2>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="เลือกรูปสินค้า">
        <div id="dropInner"><p>แตะเพื่อเลือกรูปขนม หรือลากรูปมาวาง</p></div>
      </div>
      <input type="file" id="file" accept="image/*" class="vh">
      <button type="button" class="linkbtn" id="demo">ยังไม่มีรูป ใช้ตัวอย่างไปก่อน</button>

      <label for="brand">ชื่อร้าน</label>
      <input type="text" id="brand" value="ขนมบ้านแม่">

      <label for="name">ชื่อสินค้า</label>
      <input type="text" id="name" value="ขนมเปี๊ยะไส้ถั่วไข่เค็ม">

      <div class="row">
        <div><label for="price">ราคา (บาท)</label><input type="number" id="price" value="120" min="0"></div>
        <div><label for="promo">ราคาโปร (ถ้ามี)</label><input type="number" id="promo" placeholder="เว้นว่างได้" min="0"></div>
      </div>

      <label for="hl">จุดเด่น</label>
      <textarea id="hl">แป้งบางกรอบ ไส้แน่น ไข่เค็มทั้งลูก กล่องละ 4 ชิ้น</textarea>

      <label>สีแบรนด์</label>
      <div class="swatches" id="swatches"></div>

      <button type="button" class="btn accent" id="gen">เขียนแคปชัน</button>
    </section>

    <section aria-label="ผลลัพธ์">
      <div class="posts" id="posts"></div>
      <div class="caps panel">
        <div class="caps-head">
          <h2>แคปชัน</h2>
          <span class="status" id="status" aria-live="polite"></span>
        </div>
        <div class="caplist" id="caplist">
          <div class="empty">กด "เขียนแคปชัน" เพื่อให้ AI เขียนแคปชัน 3 แนวจากข้อมูลสินค้า</div>
        </div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const PALETTES = [
  {id:'jade', name:'หยก', primary:'#1F5E4B', accent:'#E0612F', paper:'#EFE3CC', ink:'#1E1B17'},
  {id:'lacquer', name:'ครั่ง', primary:'#8E1F1B', accent:'#E3B04B', paper:'#F6EBD9', ink:'#2A1512'},
  {id:'ink', name:'หมึก', primary:'#23262B', accent:'#F2A23A', paper:'#ECE6DA', ink:'#16181B'}
];
const TEMPLATES = [
  {id:'photo', name:'รูปเต็ม'},
  {id:'kraft', name:'การ์ดกระดาษ'},
  {id:'promo', name:'โปรโมชัน'}
];
const state = {img:null, palette:PALETTES[0], format:'square'};
const $ = id => document.getElementById(id);
const seg = typeof Intl!=='undefined' && Intl.Segmenter ? new Intl.Segmenter('th',{granularity:'word'}) : null;

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- swatches ---------- */
PALETTES.forEach((p,i)=>{
  const b=document.createElement('button');b.type='button';b.className='sw';b.setAttribute('aria-pressed',i===0);
  b.innerHTML=`<i><b style="background:${p.primary}"></b><b style="background:${p.accent}"></b><b style="background:${p.paper}"></b></i>${p.name}`;
  b.onclick=()=>{state.palette=p;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
  $('swatches').appendChild(b);
});

/* ---------- format ---------- */
document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{
  state.format=b.dataset.format;
  document.querySelectorAll('[data-format]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});

/* ---------- image input ---------- */
function loadFile(f){
  if(!f||!f.type.startsWith('image/')){toast('ไฟล์นี้ไม่ใช่รูปภาพ');return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{state.img=im;showThumb(r.result);render()};im.src=r.result};
  r.readAsDataURL(f);
}
function showThumb(src){$('dropInner').innerHTML=`<img src="${src}" alt="รูปสินค้า"><p>แตะเพื่อเปลี่ยนรูป</p>`}
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.add('over')}));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();$('drop').classList.remove('over')}));
$('drop').addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

$('demo').onclick=()=>{
  const c=document.createElement('canvas');c.width=c.height=900;const x=c.getContext('2d');
  const g=x.createRadialGradient(450,420,80,450,450,640);g.addColorStop(0,'#F7E7C6');g.addColorStop(1,'#C9A574');
  x.fillStyle=g;x.fillRect(0,0,900,900);
  // plate
  x.fillStyle='rgba(0,0,0,.12)';x.beginPath();x.ellipse(460,560,330,110,0,0,Math.PI*2);x.fill();
  x.fillStyle='#FBF8F2';x.beginPath();x.ellipse(450,540,320,105,0,0,Math.PI*2);x.fill();
  // pastries
  const pos=[[330,470],[570,470],[450,540]];
  pos.forEach(([px,py])=>{
    x.fillStyle='rgba(0,0,0,.15)';x.beginPath();x.ellipse(px+6,py+28,118,40,0,0,Math.PI*2);x.fill();
    const pg=x.createRadialGradient(px-30,py-40,10,px,py,140);pg.addColorStop(0,'#F4D9A0');pg.addColorStop(.7,'#D9A560');pg.addColorStop(1,'#B37A3C');
    x.fillStyle=pg;x.beginPath();x.ellipse(px,py,120,82,0,0,Math.PI*2);x.fill();
    x.fillStyle='#8E1F1B';x.beginPath();x.arc(px,py-8,9,0,Math.PI*2);x.fill();
  });
  const im=new Image();im.onload=()=>{state.img=im;showThumb(c.toDataURL());render()};im.src=c.toDataURL();
};

['brand','name','price','promo','hl'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(render._t);render._t=setTimeout(render,120)}));

/* ---------- drawing helpers ---------- */
function data(){
  return {
    brand:$('brand').value.trim()||'ร้านของเรา',
    name:$('name').value.trim()||'ชื่อสินค้า',
    price:$('price').value.trim(),
    promo:$('promo').value.trim(),
    hl:$('hl').value.trim()
  };
}
function words(t){return seg?[...seg.segment(t)].map(s=>s.segment):t.split(/(\s+)/)}
function wrap(ctx,text,maxW,maxLines){
  const lines=[];let cur='';
  for(const w of words(text)){
    const test=cur+w;
    if(ctx.measureText(test).width>maxW&&cur){lines.push(cur.trim());cur=w.trimStart()}else cur=test;
  }
  if(cur.trim())lines.push(cur.trim());
  if(lines.length>maxLines){const k=lines.slice(0,maxLines);let l=k[maxLines-1];while(ctx.measureText(l+'…').width>maxW&&l.length)l=l.slice(0,-1);k[maxLines-1]=l+'…';return k}
  return lines;
}
function cover(ctx,img,x,y,w,h){
  if(!img){ctx.fillStyle='#D8C9AE';ctx.fillRect(x,y,w,h);ctx.fillStyle='rgba(0,0,0,.35)';ctx.font=`500 ${w*.05}px Mitr`;ctx.textAlign='center';ctx.fillText('ใส่รูปสินค้า',x+w/2,y+h/2);ctx.textAlign='left';return}
  const s=Math.max(w/img.width,h/img.height),iw=img.width*s,ih=img.height*s;
  ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const baht=v=>'฿'+Number(v).toLocaleString('th-TH');

/* ---------- templates ---------- */
function drawPhoto(ctx,W,H,d,p){
  cover(ctx,state.img,0,0,W,H);
  const g=ctx.createLinearGradient(0,H*.45,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.78)');
  ctx.fillStyle=g;ctx.fillRect(0,H*.45,W,H*.55);
  const m=W*.07;
  // brand pill
  ctx.font=`500 ${W*.034}px Mitr`;const bw=ctx.measureText(d.brand).width+W*.06;
  ctx.fillStyle=p.paper;rr(ctx,m,m,bw,W*.07,W*.035);ctx.fill();
  ctx.fillStyle=p.primary;ctx.fillText(d.brand,m+W*.03,m+W*.047);
  // price disc
  const shown=d.promo||d.price;
  if(shown){
    const r=W*.13,cx=W-m-r,cy=H-m-r;
    ctx.fillStyle=p.accent;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`600 ${W*.075}px Mitr`;ctx.fillText(baht(shown),cx,cy+W*.022);
    if(d.promo&&d.price){ctx.font=`400 ${W*.03}px Mitr`;const t=baht(d.price);ctx.fillText(t,cx,cy-W*.06);const tw=ctx.measureText(t).width;ctx.fillRect(cx-tw/2,cy-W*.07,tw,W*.004)}
    ctx.textAlign='left';
  }
  const maxW=W-m*2-(shown?W*.3:0);
  ctx.fillStyle='#fff';ctx.font=`600 ${W*.07}px Mitr`;
  const nl=wrap(ctx,d.name,maxW,2);
  ctx.font=`400 ${W*.034}px "IBM Plex Sans Thai"`;const hl=d.hl?wrap(ctx,d.hl,maxW,2):[];
  let y=H-m-hl.length*W*.048;
  ctx.fillStyle='rgba(255,255,255,.85)';hl.forEach((l,i)=>ctx.fillText(l,m,y+i*W*.048+W*.03));
  ctx.fillStyle='#fff';ctx.font=`600 ${W*.07}px Mitr`;
  nl.slice().reverse().forEach((l,i)=>ctx.fillText(l,m,y-W*.025-i*W*.085));
}
function drawKraft(ctx,W,H,d,p){
  ctx.fillStyle=p.paper;ctx.fillRect(0,0,W,H);
  // subtle fibres
  ctx.globalAlpha=.06;ctx.fillStyle=p.ink;
  for(let i=0;i<260;i++){const x=(i*397)%W,y=(i*613)%H;ctx.fillRect(x,y,W*.012,1.5)}
  ctx.globalAlpha=1;
  const m=W*.07,ph=state.format==='story'?H*.6:H*.56;
  ctx.save();rr(ctx,m,m,W-m*2,ph,W*.04);ctx.clip();cover(ctx,state.img,m,m,W-m*2,ph);ctx.restore();
  let y=m+ph+W*.1;
  ctx.fillStyle=p.primary;ctx.font=`500 ${W*.032}px Mitr`;ctx.fillText(d.brand,m,y);
  y+=W*.085;ctx.fillStyle=p.ink;ctx.font=`600 ${W*.068}px Mitr`;
  wrap(ctx,d.name,W-m*2,2).forEach((l,i)=>{ctx.fillText(l,m,y);y+=W*.082});
  if(d.hl){ctx.fillStyle=p.ink;ctx.globalAlpha=.72;ctx.font=`400 ${W*.034}px "IBM Plex Sans Thai"`;
    wrap(ctx,d.hl,W-m*2,state.format==='story'?4:2).forEach(l=>{ctx.fillText(l,m,y);y+=W*.05});ctx.globalAlpha=1}
  const shown=d.promo||d.price;
  if(shown){
    ctx.font=`600 ${W*.064}px Mitr`;const t=baht(shown);const tw=ctx.measureText(t).width;
    const bx=W-m-tw-W*.08,by=m+ph-W*.075;
    ctx.fillStyle=p.accent;rr(ctx,bx,by,tw+W*.08,W*.11,W*.055);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText(t,bx+W*.04,by+W*.078);
  }
}
function drawPromo(ctx,W,H,d,p){
  ctx.fillStyle=p.primary;ctx.fillRect(0,0,W,H);
  const story=state.format==='story';
  const r=W*(story?.36:.25),cx=W/2,cy=story?H*.38:H*.34;
  ctx.fillStyle=p.accent;ctx.globalAlpha=.25;ctx.beginPath();ctx.arc(cx,cy,r*1.12,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();cover(ctx,state.img,cx-r,cy-r,r*2,r*2);ctx.restore();
  // corner band
  ctx.save();ctx.translate(W,0);ctx.rotate(Math.PI/4);
  ctx.fillStyle=p.accent;ctx.fillRect(-W*.35,W*.14,W*.7,W*.1);
  ctx.fillStyle=p.primary;ctx.font=`600 ${W*.042}px Mitr`;ctx.textAlign='center';
  ctx.fillText(d.promo?'ราคาพิเศษ':'มาใหม่',0,W*.205);ctx.restore();
  ctx.textAlign='center';
  let y=cy+r+W*(story?.16:.09);
  ctx.fillStyle=p.paper;ctx.font=`600 ${W*.066}px Mitr`;
  wrap(ctx,d.name,W*.84,story?2:1).forEach(l=>{ctx.fillText(l,cx,y);y+=W*.08});
  const shown=d.promo||d.price;
  if(shown){
    y+=W*.03;
    if(d.promo&&d.price){
      ctx.font=`400 ${W*.042}px Mitr`;ctx.globalAlpha=.7;const t=baht(d.price);const tw=ctx.measureText(t).width;
      ctx.fillText(t,cx,y);ctx.fillRect(cx-tw/2,y-W*.013,tw,W*.005);ctx.globalAlpha=1;y+=W*.02;
    }
    ctx.fillStyle=p.accent;ctx.font=`600 ${W*(story?.13:.1)}px Mitr`;ctx.fillText(baht(shown),cx,y+W*(story?.11:.08));
    y+=W*(story?.15:.1);
  }
  ctx.fillStyle=p.paper;ctx.globalAlpha=.8;ctx.font=`500 ${W*.03}px Mitr`;ctx.fillText(d.brand,cx,H-W*.06);ctx.globalAlpha=1;
  ctx.textAlign='left';
}
const DRAW={photo:drawPhoto,kraft:drawKraft,promo:drawPromo};

/* ---------- render ---------- */
const postsEl=$('posts');const canvases={};
TEMPLATES.forEach(t=>{
  const wrapEl=document.createElement('figure');wrapEl.className='post';wrapEl.style.margin='0';
  const c=document.createElement('canvas');c.setAttribute('role','img');c.setAttribute('aria-label','ตัวอย่างโพสต์แบบ'+t.name);
  const meta=document.createElement('figcaption');meta.className='meta';
  meta.innerHTML=`<span>${t.name}</span>`;
  const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='บันทึกรูป';b.onclick=()=>save(t,c);
  meta.appendChild(b);wrapEl.append(c,meta);postsEl.appendChild(wrapEl);canvases[t.id]={c,b};
});
function render(){
  const W=1080,H=state.format==='story'?1920:1080,d=data(),p=state.palette;
  TEMPLATES.forEach(t=>{const {c}=canvases[t.id];c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.textBaseline='alphabetic';DRAW[t.id](ctx,W,H,d,p)});
}

/* ---------- downloads ---------- */
let dl=null;
async function save(t,c){
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const fname=`${data().name}-${t.name}-${state.format==='story'?'story':'post'}.png`;
  if(dl){
    try{await dl.save({filename:fname,data:blob});toast('บันทึกรูปแล้ว')}
    catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('รอสักครู่แล้วลองใหม่');return}toast('บันทึกรูปในหน้านี้ไม่ได้')}
  }else{
    // fallback: open image so it can be long-pressed / right-clicked to save
    const w=window.open();if(w){w.document.write(`<img src="${c.toDataURL('image/png')}" style="max-width:100%">`)}else toast('กดค้างที่รูปเพื่อบันทึก')
  }
}

/* ---------- captions ---------- */
let sample=null;
function localCaptions(d){
  const pr=d.promo?`จาก ${baht(d.price)} เหลือ ${baht(d.promo)}`:(d.price?`ราคา ${baht(d.price)}`:'');
  const tag=['#'+d.name.replace(/\s+/g,''),'#'+d.brand.replace(/\s+/g,''),'#ขนมจีน','#ของฝาก'];
  return [
    {style:'ขายตรง เข้าใจง่าย',text:`${d.name}\n${d.hl}\n${pr}\nสั่งได้เลยทางแชท`,hashtags:tag},
    {style:'เป็นกันเอง',text:`ใครสายขนมต้องลอง ${d.name} ของ${d.brand} เลยค่ะ ${d.hl} ${pr} ทักมาจองกันได้นะคะ`,hashtags:tag},
    {style:'เร่งโปรโมชัน',text:`${d.promo?'โปรพิเศษ':'ของใหม่มาแล้ว'}! ${d.name} ${pr}\n${d.hl}\nของมีจำนวนจำกัด รีบทักมาเลย`,hashtags:tag}
  ];
}
function showCaps(list,note){
  const el=$('caplist');el.innerHTML='';
  list.forEach(c=>{
    const card=document.createElement('article');card.className='cap';
    const h=document.createElement('h3');h.textContent=c.style;
    const p=document.createElement('p');p.textContent=c.text;
    const tags=document.createElement('div');tags.className='tags';tags.textContent=(c.hashtags||[]).join(' ');
    const b=document.createElement('button');b.type='button';b.className='btn ghost';b.textContent='คัดลอกแคปชัน';
    b.onclick=async()=>{const full=c.text+'\n\n'+(c.hashtags||[]).join(' ');
      try{await navigator.clipboard.writeText(full);toast('คัดลอกแล้ว')}
      catch{const ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('คัดลอกแล้ว')}catch{toast('คัดลอกไม่ได้ ลองเลือกข้อความเอง')}ta.remove()}};
    card.append(h,p,tags,b);el.appendChild(card);
  });
  $('status').textContent=note||'';
}
$('gen').onclick=async()=>{
  const d=data();
  if(!sample){showCaps(localCaptions(d),'แคปชันจากแม่แบบ (AI ใช้ไม่ได้ในหน้านี้)');return}
  const btn=$('gen');btn.disabled=true;btn.textContent='กำลังเขียน…';$('status').textContent='AI กำลังเขียนแคปชัน';
  const prompt=`คุณคือแอดมินร้านขนมจีนออนไลน์ในไทย เขียนแคปชันโพสต์ขายสินค้าภาษาไทยสำหรับ Facebook และ LINE จำนวน 3 แบบ
แบบที่ 1 "ขายตรง เข้าใจง่าย": สั้น ชัด บอกของ ราคา และวิธีสั่ง
แบบที่ 2 "เป็นกันเอง": อบอุ่น เหมือนแม่ค้าคุยกับลูกค้าประจำ ใช้คำลงท้าย "ค่ะ"
แบบที่ 3 "เร่งโปรโมชัน": กระตุ้นให้รีบสั่ง
ใช้อีโมจิได้เล็กน้อย ห้ามแต่งข้อมูลที่ไม่มีในข้อมูลสินค้า (เช่น ห้ามแต่งวันหมดโปรหรือของแถม)
ข้อมูลสินค้า:
- ชื่อร้าน: ${d.brand}
- สินค้า: ${d.name}
- ราคา: ${d.price||'ไม่ระบุ'} บาท
- ราคาโปร: ${d.promo||'ไม่มี'}
- จุดเด่น: ${d.hl||'ไม่ระบุ'}
ตอบเป็น JSON อย่างเดียว รูปแบบ: {"captions":[{"style":"ชื่อแบบ","text":"ข้อความแคปชัน","hashtags":["#แท็ก", "..."]}]} แต่ละแบบมีแฮชแท็ก 3-5 อัน`;
  try{
    const out=await sample.json(prompt,{modelTier:'quick'});
    const list=out&&Array.isArray(out.captions)?out.captions.filter(c=>c&&c.text):[];
    if(!list.length)throw {code:'empty'};
    showCaps(list,'เขียนโดย AI ตรวจข้อความก่อนโพสต์ทุกครั้ง');
  }catch(e){
    const code=e&&e.code;
    if(code==='not_granted'){sample=null;showCaps(localCaptions(d),'ไม่ได้อนุญาตให้ใช้ AI จึงใช้แคปชันจากแม่แบบแทน')}
    else if(code==='rate_limited')$('status').textContent='ส่งคำขอถี่เกินไป รอสักครู่แล้วกดอีกครั้ง';
    else if(code==='cancelled')$('status').textContent='';
    else showCaps(localCaptions(d),'AI ตอบไม่สำเร็จ จึงใช้แคปชันจากแม่แบบแทน');
  }finally{btn.disabled=false;btn.textContent='เขียนแคปชันใหม่'}
};

/* ---------- boot ---------- */
(async()=>{
  try{await Promise.all([document.fonts.load('600 40px Mitr'),document.fonts.load('500 40px Mitr'),document.fonts.load('400 40px "IBM Plex Sans Thai"')])}catch{}
  render();
  if(window.claude&&claude.use){
    claude.use('sample').then(s=>{sample=s}).catch(()=>{});
    claude.use('downloads').then(x=>{dl=x}).catch(()=>{});
  }
})();
</script>
</body>
