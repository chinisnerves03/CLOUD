/* ---------- camera ---------- */
const SEG=[[0,6,[270,540,1],[270,540,1.09],E.io3],[6,9,[250,650,1.55],[250,650,1.68],E.lin],[9,12,[110,625,1.3],[215,625,1.3],E.io3],[12,16,[262,615,1.2],[272,615,1.27],E.io3],
 [16,20,[203,708,2.1],[212,708,2.38],E.io3],[20,30,[270,540,1],[270,540,1],E.lin],[30,30.3,[270,610,1.12],[270,610,1.12],E.lin],[30.3,34,[270,610,1.12],[270,-1010,.86],E.io3]];
function cam(t){if(t>=34)return[270,-1010,.86];let s=SEG[0];for(const g of SEG)if(t>=g[0])s=g;const k=s[4](clamp((t-s[0])/(s[1]-s[0])));return[mix(s[2][0],s[3][0],k),mix(s[2][1],s[3][1],k),mix(s[2][2],s[3][2],k)]}
function layer(id,p,c,jx,jy){const[cx,cy,z]=c,zz=1+(z-1)*p,ax=270+(cx-270)*p,ay=480+(cy-480)*p;$(id).setAttribute('transform',`translate(${270+jx} ${480+jy}) scale(${zz.toFixed(4)}) translate(${(-ax).toFixed(2)} ${(-ay).toFixed(2)})`)}
const speak=(t,a,b)=>t>=a&&t<b?.2+.8*Math.abs(Math.sin((t-a)*17)):0.12;

/* ---------- audio ---------- */
let AC=null,nb=null,muted=false;
function A(){if(AC||muted)return;AC=new(window.AudioContext||window.webkitAudioContext)();const m=AC.createGain();m.gain.value=.4;m.connect(AC.destination);AC.m=m;nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function noise(dur,type,f0,f1,vol,atk=.01){if(!AC||muted)return;const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,AC.currentTime);if(f1)f.frequency.exponentialRampToValueAtTime(f1,AC.currentTime+dur);f.Q.value=1.2;const g=AC.createGain();g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(vol,AC.currentTime+atk);g.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+dur);s.connect(f);f.connect(g);g.connect(AC.m);s.start();s.stop(AC.currentTime+dur+.05)}
function tone(fr,dur,vol,type='sine',fr2){if(!AC||muted)return;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(fr,AC.currentTime);if(fr2)o.frequency.exponentialRampToValueAtTime(fr2,AC.currentTime+dur);const g=AC.createGain();g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+dur);o.connect(g);g.connect(AC.m);o.start();o.stop(AC.currentTime+dur+.02)}
const chirp=()=>{tone(3100,.07,.05,'sine',4000);setTimeout(()=>tone(3500,.06,.05,'sine',4300),90)};
const EV=[[.3,chirp],[1.1,chirp],[1.9,chirp],[2.6,chirp],[3.0,()=>noise(13,'lowpass',500,350,.09,1.2)],[4.6,chirp],
 [9.3,()=>tone(180,.08,.18)],[9.8,()=>tone(170,.08,.18)],[10.3,()=>tone(170,.08,.16)],[10.8,()=>tone(160,.08,.14)],[11.2,()=>tone(150,.08,.1)],
 [12.0,()=>noise(.9,'bandpass',500,2600,.28,.15)],[17.0,()=>noise(.8,'highpass',2500,4000,.06,.05)],[17.8,()=>tone(900,.12,.06,'triangle',500)],
 [22.9,()=>tone(1200,.05,.14,'square')],[26.15,()=>{tone(90,.14,.35,'sine',50);noise(.14,'lowpass',400,200,.3)}],[26.7,()=>noise(.45,'highpass',1800,5000,.2,.02)],
 [37.0,()=>tone(880,.07,.2,'square')],[37.1,()=>tone(988,.07,.2,'square')],[37.2,()=>tone(1175,.12,.2,'square')],[40.1,()=>noise(.5,'highpass',2000,3500,.1,.05)]];

/* ---------- render ---------- */
const CAP=[[1.0,4.0,"Lost and Found Log, entry one."],[4.2,9.5,"In a city built from things people lost…\nsomething just went missing."],[9.9,13.7,"The Great Red Button.\nWide as a fountain."],[14.0,18.1,"The pride of Pocket City.\nGone before breakfast."],[19.0,21.8,"PIP: Huh. That's… interesting."],[22.2,26.8,"JUNO: Interesting? Pip, somebody walked\noff with a whole BUTTON."],[27.3,30.0,"Detective Pip Thimble checked the stone."],[30.2,32.9,"No drag marks. No footprints."],[33.2,36.9,"Just one thing, scratched very small."],[38.0,40.7,"PIP: (whispers) Small clue. Big picture."],[41.4,43.8,"And far above the plaza…"],[43.9,46.1,"…a thread tightened."],[46.4,48.9,"Something was still pulling."]];
const bunt=document.querySelectorAll('.flag'),motes=document.querySelectorAll('.mo'),cds=document.querySelectorAll('.cd');
const S={plaza:$('S_plaza'),lens:$('S_lens'),card:$('S_card'),thread:$('S_thread'),end:$('S_end')};
let t=0,playing=false,last=0,prevT=0,fired=new Set();

const WP=[[0,0],[3,3],[13.9,6],[17.9,9],[19.0,11.4],[21.9,12.0],[23.0,13.15],[26.9,15.9],[27.2,16],[33.2,20],[37.2,26],[41.2,30],[44.0,34],[44.5,36],[45.05,37],[46.5,37.4],[49.6,39.8],[50.0,40],[53.0,43],[53.2,43.2]];
function warp(x){for(let i=1;i<WP.length;i++)if(x<=WP[i][0]){const a=WP[i-1],b=WP[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return 43.2}
function render(tn){const t=warp(tn),cn=Math.floor(tn*12)/12;
 const ct=Math.floor(t*12)/12,qt=Math.floor(t*24)/24,fr=Math.floor(t*12);
 const sc=t<20||(t>=30&&t<34)?'plaza':t<26?'lens':t<30?'card':t<40?'thread':'end';
 for(const k in S)S[k].style.display=k===sc?'':'none';
 $('pt').setAttribute('seed',3+(Math.floor(t*3)%4));
 // jitter (stop-motion handheld)
 const jx=(rnd(fr)-.5)*1.4,jy=(rnd(fr+99)-.5)*1.4;
 // dawn & fades
 const dl=$('dawn');if(t<3){const w=540*R(t,.2,1.3,E.out3),hh=mix(2,70,R(t,1.2,2.6,E.io3));dl.setAttribute('x',270-w/2);dl.setAttribute('width',w);dl.setAttribute('y',480-hh/2);dl.setAttribute('height',hh);dl.setAttribute('opacity',1-R(t,2.2,3,E.lin))}else dl.setAttribute('opacity',0);
 $('sweep').setAttribute('x',mix(-540,540,R(t,1.5,3.6,E.io3)));
 let bo=t<3?1-R(t,1.5,3.0,E.io3):0;if(t>=39.55&&t<40)bo=R(t,39.55,40,E.lin);if(t>=42.4)bo=R(t,42.4,43,E.lin)*0;$('black').setAttribute('opacity',bo);
 if(sc==='plaza'){
  const c=cam(qt);
  layer('L_sky',.9,c,jx,jy);layer('L_bg',.6,c,jx,jy);layer('L_mid',1,c,jx,jy);layer('L_fg',1.38,c,jx,jy);
  bunt.forEach(f=>{const i=+f.dataset.i,x=f.getAttribute('transform').match(/translate\(([-\d.]+) ([-\d.]+)\)/);tr(f,+x[1],+x[2],Math.sin(ct*2.2+i)*7,1,1)});
  crowd.forEach(o=>{const bob=(Math.floor(ct*3+o.i*.37)%2)*-3;tr(o.e,o.x,o.y+bob,Math.sin(ct*1.4+o.i)*2,o.sc)});
  // thread bg twitch hint (before final shot)
  const tw=t>=32.5?Math.sin((t-32.5)*8)*3*Math.exp(-(t-32.5)*.8):0;$('thrBg').setAttribute('d',`M270 -1500 Q${270+tw} -1100 270 -720`);
  // ---- Pip ----
  const P=$('pip'),walkK=R(ct,9.0,11.4,E.out2),px0=-60,px1=176,x=t<9?-120:mix(px0,px1,walkK);
  const moving=t>=9&&t<11.4&&walkK<.995,ph=x/13;
  const kneel=R(ct,16.25,16.9,E.back)*(t<20?1:0)*(t>=16?1:0);
  const yawn=R(ct,9.5,10.0,E.io3)*(1-R(ct,10.5,10.9,E.io3));
  const curious=R(ct,11.2,11.6,E.back)*(1-R(ct,12.2,12.8,E.io3));
  const look=t>=30?R(ct,30.4,33,E.io3):0;
  const bob=moving?Math.abs(Math.sin(ph))*-3.2:0,sw=moving?Math.sin(ph)*28:0;
  const shrug=R(ct,14.4,14.8,E.back)*(1-R(ct,15.2,15.7,E.io3));
  const py=760+(kneel?0:0);
  tr(P,x,py,0,1);
  tr($('pL'),-8,-32+kneel*24,mix(sw,70*kneel,kneel>0?1:0)*1,1);
  tr($('pR'),8,-32+kneel*24,mix(-sw,-22*kneel,kneel>0?1:0),1);
  tr($('pB'),0,-32+bob+kneel*24+(shrug*-3),16*kneel-4*yawn,1,1-.03*kneel);
  tr($('pAL'),-16,-40,moving?-sw*1.1:12*shrug+8*kneel,1);
  tr($('pAR'),16,-40,yawn>0?-150*yawn+(moving?sw*(1-yawn):0):(moving?sw*1.1:0)+(kneel?-66*kneel-Math.sin(ct*9)*12*kneel*(t>16.9?1:0):0)-26*shrug,1);
  const lk=t>=30?-26*look:0; // look up: rotate head backwards
  tr($('pH'),0,-44,-12*yawn+9*curious+lk+(kneel?10*kneel:0),1);
  const blink=(ct%3.1)<.12||yawn>.5;$('pEL').setAttribute('transform',`translate(-8 -20) scale(1 ${blink?.12:1})`);$('pER').setAttribute('transform',`translate(8 -20) scale(1 ${blink?.12:1})`);
  document.querySelectorAll('#pip .pp').forEach(p=>p.setAttribute('cx',look>0?1.4:(curious>0.1?3.3:2.2)));
  const pm=$('pM'),sp=speak(cn,19.05,21.75);if(yawn>.05){pm.setAttribute('rx',4+4*yawn);pm.setAttribute('ry',1+8*yawn)}else{pm.setAttribute('rx',3.4);pm.setAttribute('ry',sp*3.4+.8)}
  $('pBr').setAttribute('transform',`translate(0 ${-3*curious-1.5*shrug})`);
  tr($('pT'),0,0,Math.sin(ct*9)*(moving?3:0)+curious*6,1);
  // ---- Juno ----
  const J=$('juno'),jin=R(ct,12.0,13.15,E.out3),jx0=620,jx1=372,jxx=mix(jx0,jx1,jin),jyj=700-Math.sin(ct*2.4)*4;
  J.style.display=t<12?'none':'';
  tr(J,jxx,jyj,0,-1,1);
  tr($('jG'),0,0,mix(-16,0,R(ct,12.0,13.5,E.back))+Math.sin(ct*2.4)*1.4,1);
  const lean=jin<1?-6*(1-jin):0;tr($('jP'),0,0,lean+Math.sin(ct*2)*.8,1);
  $('jM').setAttribute('ry',(speak(cn,22.3,26.7))*3.4+.7);
  $('jBr').setAttribute('transform',`translate(0 ${(ct>14.9&&ct<15.8)?-2:0})`);
  tr($('jSc'),0,0,Math.sin(ct*13)*3+(1-jin)*6,1);
  // ---- magnifier ----
  const M=$('mag'),mk=R(ct,17.8,18.5,E.out3),swing=Math.sin((ct-17.8)*12)*Math.exp(-(ct-17.8)*3.5)*18;
  M.style.display=(t>=17.8&&t<20)?'':'none';
  const mx=mix(280,x+44,mk)+swing*(1-mk),my=mix(560,744,mk);
  tr($('magB'),mx,my,swing*.6,1);$('magT').setAttribute('d',`M${x+8} ${py-52+(kneel*24)} Q${(x+mx)/2} ${(py-40+my)/2+8} ${mx-6} ${my-10}`);
  // ---- dust ----
  puffs.forEach((c,i)=>{const s=17.1+i*.07,k=clamp((t-s)/1.0);if(k<=0||k>=1){c.setAttribute('r',0);return}
   c.setAttribute('cx',x+36+i*7+k*(10+i*3));c.setAttribute('cy',754-k*(18+i*2)+i%2*4);c.setAttribute('r',2+k*(5+i%3*2));c.setAttribute('opacity',(1-k)*.8)});
 }
 if(sc==='lens'){
  const k=R(ct,20,22.8,E.io3),lx=mix(70,330,k)+Math.sin(ct*7)*3*(1-k),ly=mix(690,520,k)+Math.sin(ct*5)*6*(1-k)+(t>22.8?Math.sin(ct*22)*.8:0);
  const pulse=1+.07*Math.sin(clamp((t-23)/.9)*Math.PI)*(t>23?1:0);
  $('lensG').setAttribute('transform',`translate(${lx} ${ly}) scale(${pulse})`);
  $('lensInner').setAttribute('transform',`scale(2.5) translate(${-lx} ${-ly})`);
  document.querySelectorAll('#S_lens').forEach(g=>g.style.display='');
  const camz=1+.06*R(t,20,26,E.lin);$('S_lens').setAttribute('transform',`translate(270 480) scale(${camz}) translate(${-270+jx} ${-480+jy})`);
  motes.forEach(m=>{const i=+m.dataset.i;m.setAttribute('cx',(rnd(i)*540+t*8*(1+i%3))%540);m.setAttribute('cy',(rnd(i+7)*960-t*6*(1+i%2)+960)%960)});
 }
 if(sc==='card'){
  const tt=t-26,fall=R(t,26,26.2,E.in2);let y=mix(-700,480,fall),sx=1,sy=1,rot=-4;
  if(t>=26.2){const b=t-26.2;const sq=Math.exp(-b*9)*Math.cos(b*30);sy=1-.1*sq;sx=1+.06*sq;y=480-Math.abs(Math.sin(b*14))*Math.exp(-b*7)*18}
  const shake=t>=26.2?Math.exp(-(t-26.2)*10)*Math.sin((t-26.2)*60)*6:0;
  tr($('cardG'),270+shake,y,rot+(t>=26.2?Math.sin((t-26.2)*10)*Math.exp(-(t-26.2)*5)*2.5:0),sx,sy);
  const z=1+.07*R(t,27,30,E.out2);$('S_card').setAttribute('transform',`translate(270 480) scale(${z}) translate(${-270+jx} ${-480+jy})`);
  cds.forEach(c=>{const i=+c.dataset.i,k=clamp((t-26.2)/.7),a=i/8*Math.PI*2;c.setAttribute('cx',270+Math.cos(a)*(120+k*90));c.setAttribute('cy',600+Math.sin(a)*14*(1+k)-k*22);c.setAttribute('r',k>0&&k<1?3+k*9:0);c.setAttribute('opacity',(1-k)*.7)})
 }
 if(sc==='thread'){
  const b=t-34,N=70,pts=[],pts2=[],pull=R(t,36.9,37.15,E.out3)*38+R(t,37.4,39.8,E.io3)*160;
  const slack=R(t,36.0,36.8,E.io3)*(1-R(t,36.95,37.0,E.lin))*10;
  const ripT=t-37.0;
  for(let i=0;i<=N;i++){const y=-20+i*(1040/N);let x=270+Math.sin(y*.012+t*.9)*1.6;
   x+=Math.sin(y*.02)*slack;
   if(ripT>0)x+=Math.sin(y*.045-ripT*26)*Math.exp(-ripT*3.2)*Math.exp(-Math.abs(y-(900-ripT*1400))*.0025)*13;
   pts.push(`${x.toFixed(1)},${(y-pull).toFixed(1)}`)}
  const s=pts.join(' ');['thr','thr2','thr3'].forEach(id=>$(id).setAttribute('points',s));
  $('thr3').setAttribute('stroke-dashoffset',-(t*30)%24);
  const z=1+.05*R(t,34,40,E.lin);$('S_thread').setAttribute('transform',`translate(270 480) scale(${z}) translate(${-270+jx} ${-480+jy})`);
 }
 if(sc==='end'){
  const k=R(t,40.1,40.8,E.out3);$('endG').setAttribute('opacity',k);$('endG').setAttribute('transform',`translate(0 ${(1-k)*14})`);
  const bl=t>=41.5&&t<41.75?.15:1;$('endEye').setAttribute('transform',`scale(1 ${bl})`);
 }
 // captions
 const c=CAP.find(c=>tn>=c[0]&&tn<c[1]);$('cap').textContent=c?c[2]:'';
 $('sc').value=tn;$('tm').textContent=tn.toFixed(1)+' / '+DUR.toFixed(1);
}

const VOSRC=/*VOSRC*/{};
const VO=[['n1',1.0],['n2',9.9],['pip1',18.9],['juno',22.2],['n3',27.3],['pip2',37.9],['n4',41.4]].map(([k,st])=>{const a=new Audio(VOSRC[k]);a.preload='auto';return{a,s:st}});
function syncAudio(tn,play){VO.forEach(v=>{const off=tn-v.s,d=v.a.duration||9;if(play&&off>=0&&off<d-.02){if(v.a.paused||Math.abs(v.a.currentTime-off)>.3){try{v.a.currentTime=off}catch(e){}v.a.play().catch(()=>{})}}else if(!v.a.paused)v.a.pause()})}
function frame(ts){
 if(playing){const dt=Math.min(.1,(ts-last)/1000);prevT=t;t+=dt;
  if(t>=DUR){t=DUR;playing=false;syncAudio(t,false);$('play').textContent='▶ Replay'}
  const wp=warp(prevT),wc=warp(t);EV.forEach(([et,fn],i)=>{if(wp<et&&wc>=et&&!fired.has(i)){fired.add(i);fn()}});syncAudio(t,true)
 }
 last=ts;render(t);requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
$('play').onclick=()=>{A();if(AC&&AC.state==='suspended')AC.resume();if(t>=DUR-.05){t=0;prevT=0;fired.clear()}playing=!playing;if(!playing)syncAudio(t,false);$('play').textContent=playing?'❚❚ Pause':'▶ Play'};
$('sc').oninput=e=>{t=+e.target.value;prevT=t;fired.clear();EV.forEach(([et],i)=>{if(et<warp(t))fired.add(i)});syncAudio(t,playing);render(t)};
$('mu').onclick=()=>{muted=!muted;VO.forEach(v=>v.a.muted=muted);$('mu').textContent=muted?'🔇':'🔊';if(!muted)A()};
window.seek=x=>{t=x;prevT=x;fired.clear();EV.forEach(([et],i)=>{if(et<warp(x))fired.add(i)});syncAudio(t,false);render(t)};
render(0);
